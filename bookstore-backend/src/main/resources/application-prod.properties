# ---------- Database (production) ----------
# NO default values. If a variable is missing, the application will not start.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA (production) ----------
# validate = only CHECK that the tables match our entities. Never change a real database automatically.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ---------- Secrets ----------
app.jwt.secret=${JWT_SECRET}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# ---------- CORS: your real website address(es), separated by commas ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ---------- API documentation is OFF in production ----------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---------- Logging ----------
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
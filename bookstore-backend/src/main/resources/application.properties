spring.application.name=bookstore-backend
server.port=8181

# Which profile runs when nothing else is chosen.
# To choose another one, set the environment variable SPRING_PROFILES_ACTIVE (for example prod)
spring.profiles.default=dev

# Do not keep a database session open while the response is being written
spring.jpa.open-in-view=false

# JWT lifetime = 24 hours
app.jwt.expiration-ms=86400000

# Name of the first admin account
app.admin.name=Store Admin